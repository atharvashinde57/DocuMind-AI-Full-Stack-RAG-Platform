server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: documind-springboot-gateway
  
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:documind_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

app:
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  jwt:
    secret: ${JWT_SECRET:9a4f2c8d7e6b5a4f3e2d1c0b9a8f7e6d5c4b3a2f1e0d9c8b7a6f5e4d3c2b1a0}
    expiration-ms: 86400000 # 24 hours

logging:
  level:
    root: INFO
    com.documind: DEBUG
